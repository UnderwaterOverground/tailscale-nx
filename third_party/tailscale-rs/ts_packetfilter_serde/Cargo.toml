[package]
name = "ts_packetfilter_serde"
version.workspace = true
description = "serde for tailscale packet filters"
categories = ["encoding", "no-std"]
keywords = ["tailscale", "packet", "filter", "serde"]

repository.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ipnet = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
# tsnx: workspace version (default-features = false).
nom.workspace = true

ts_nodecapability = { workspace = true, features = ["serde"] }
ts_peercapability = { workspace = true, features = ["serde"] }

[dev-dependencies]
proptest.workspace = true
serde_json = { workspace = true, features = ["std"] }
# tsnx: tests use `?` on nom errors, which needs nom's std Error impl.
nom = { workspace = true, features = ["std"] }

[lints]
workspace = true
