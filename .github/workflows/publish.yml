# Pushing a tag like v1.0.0 builds the release zip in the same Docker image as
# local builds and attaches it to a draft GitHub release. Review the draft,
# then publish it.
name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but Cargo.toml says $version"; exit 1; }

      - name: Build the image
        run: make docker-image

      - name: Build the release zip
        run: make release

      - name: Keep the zip (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: dist/tailscale-nx-*.zip

      # The release action applies `draft: true` to an existing release too,
      # which would unpublish it (e.g. a re-run after publishing): skip then.
      - name: Check for a published release
        id: published
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" = "false" ]; then
            echo "already published: leaving $GITHUB_REF_NAME alone"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create a draft release
        if: startsWith(github.ref, 'refs/tags/v') && steps.published.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/tailscale-nx-*.zip
