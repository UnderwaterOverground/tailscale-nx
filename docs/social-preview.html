<!doctype html>
<!-- GitHub social preview (1280x640). Render with:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --disable-gpu \
       --window-size=1280,640 --hide-scrollbars --screenshot=docs/social-preview.png docs/social-preview.html
     Content stays inside a 40px safe border. No third-party logos. -->
<html>
<head>
<meta charset="utf-8">
<title>tailscale-nx social preview</title>
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 22% 50%, #1d3354 0%, #0d1626 55%, #090f1b 100%);
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #e8eef7;
  }
  .card { position: absolute; inset: 40px; display: flex; align-items: center; }
  .art { width: 520px; height: 560px; flex: none; }
  .text { margin-left: 36px; }
  h1 {
    margin: 0; font-size: 92px; font-weight: 800; letter-spacing: -2px;
    background: linear-gradient(90deg, #ffffff 0%, #b8f3ea 100%);
    -webkit-background-clip: text; color: transparent;
  }
  .tag { margin-top: 10px; font-size: 38px; font-weight: 600; color: #cfe0f5; }
  ul { margin: 34px 0 0; padding: 0; list-style: none; }
  li { font-size: 26px; color: #9fb3cd; margin: 12px 0; display: flex; align-items: center; }
  li::before {
    content: ""; width: 12px; height: 12px; border-radius: 50%; margin-right: 16px; flex: none;
    background: #5eead4; box-shadow: 0 0 12px #5eead4aa;
  }
  .url { margin-top: 40px; font-size: 22px; color: #6f86a6; font-family: Menlo, monospace; }
</style>
</head>
<body>
<div class="card">
  <svg class="art" viewBox="0 0 520 560" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="link" x1="0" x2="1">
        <stop offset="0" stop-color="#5eead4"/>
        <stop offset="1" stop-color="#a78bfa"/>
      </linearGradient>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="5" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <!-- Encrypted links from the handheld to a PC and a server -->
    <g fill="none" stroke="url(#link)" stroke-width="4" stroke-dasharray="10 10" stroke-linecap="round" filter="url(#glow)">
      <path d="M215 280 C 300 280, 320 140, 390 140"/>
      <path d="M215 280 C 300 280, 320 420, 390 420"/>
    </g>
    <!-- Lock badges on the links -->
    <g fill="#0d1626" stroke="#5eead4" stroke-width="3">
      <circle cx="318" cy="196" r="20"/>
      <circle cx="318" cy="364" r="20"/>
    </g>
    <g stroke="#5eead4" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M311 196 v-6 a7 7 0 0 1 14 0 v6"/>
      <path d="M311 364 v-6 a7 7 0 0 1 14 0 v6"/>
    </g>
    <g fill="#5eead4"><rect x="308" y="194" width="20" height="13" rx="2"/><rect x="308" y="362" width="20" height="13" rx="2"/></g>

    <!-- Generic handheld console -->
    <g transform="translate(20 210)">
      <rect x="0" y="0" width="200" height="140" rx="30" fill="#1b2a42" stroke="#3b5274" stroke-width="3"/>
      <rect x="40" y="18" width="120" height="104" rx="8" fill="#0c1424" stroke="#5eead4" stroke-width="2"/>
      <rect x="52" y="30" width="96" height="80" rx="4" fill="url(#link)" opacity="0.18"/>
      <circle cx="20" cy="44" r="9" fill="#2c4060"/>
      <circle cx="180" cy="96" r="9" fill="#2c4060"/>
      <g fill="#2c4060"><circle cx="180" cy="36" r="5"/><circle cx="172" cy="46" r="5"/><circle cx="188" cy="46" r="5"/><circle cx="180" cy="56" r="5"/></g>
      <rect x="12" y="86" width="16" height="5" rx="2" fill="#2c4060"/>
      <rect x="17.5" y="80.5" width="5" height="16" rx="2" fill="#2c4060"/>
    </g>

    <!-- PC monitor -->
    <g transform="translate(392 92)">
      <rect x="0" y="0" width="112" height="76" rx="8" fill="#1b2a42" stroke="#a78bfa" stroke-width="3"/>
      <rect x="10" y="10" width="92" height="56" rx="3" fill="#0c1424"/>
      <path d="M24 46 l14 -14 l12 10 l18 -20 l14 12" fill="none" stroke="#a78bfa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="48" y="76" width="16" height="14" fill="#2c4060"/>
      <rect x="30" y="90" width="52" height="6" rx="3" fill="#2c4060"/>
    </g>

    <!-- Server -->
    <g transform="translate(400 372)">
      <rect x="0" y="0" width="96" height="30" rx="6" fill="#1b2a42" stroke="#a78bfa" stroke-width="3"/>
      <rect x="0" y="36" width="96" height="30" rx="6" fill="#1b2a42" stroke="#a78bfa" stroke-width="3"/>
      <g fill="#5eead4"><circle cx="16" cy="15" r="4"/><circle cx="16" cy="51" r="4"/></g>
      <g stroke="#2c4060" stroke-width="4" stroke-linecap="round"><path d="M44 15 h36"/><path d="M44 51 h36"/></g>
    </g>
  </svg>

  <div class="text">
    <h1>tailscale-nx</h1>
    <div class="tag">Tailscale for the Nintendo Switch</div>
    <ul>
      <li>Moonlight &amp; homebrew on your tailnet</li>
      <li>Runs at boot, in the background</li>
      <li>Atmosphère sysmodule + overlay</li>
    </ul>
    <div class="url">github.com/UnderwaterOverground/tailscale-nx</div>
  </div>
</div>
</body>
</html>
