[package]
name = "tsnx-core"
description = "Sans-IO Tailscale engine core (no_std + alloc)"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
default = []
std = []
# The Switch's overlay buffer limits on any target (for host-side memory tests).
switch-limits = []

[dependencies]
chacha20poly1305.workspace = true
x25519-dalek.workspace = true
blake2.workspace = true
rustls.workspace = true
sha2.workspace = true
hmac.workspace = true
p256.workspace = true
p384.workspace = true
rsa.workspace = true
rand_core.workspace = true
rand_chacha.workspace = true
spin.workspace = true
base64.workspace = true
serde.workspace = true
crypto_box.workspace = true
zerocopy.workspace = true
smoltcp.workspace = true
log.workspace = true
serde_json.workspace = true
ts_keys = { path = "../../third_party/tailscale-rs/ts_keys", default-features = false }
ts_time = { path = "../../third_party/tailscale-rs/ts_time", default-features = false }
ts_util = { path = "../../third_party/tailscale-rs/ts_util", default-features = false }
ts_tunnel = { path = "../../third_party/tailscale-rs/ts_tunnel", default-features = false }
ts_disco_protocol = { path = "../../third_party/tailscale-rs/ts_disco_protocol", default-features = false, features = ["alloc"] }
ts_packet = { path = "../../third_party/tailscale-rs/ts_packet", default-features = false }

[dev-dependencies]
hex-literal.workspace = true
