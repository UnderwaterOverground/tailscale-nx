[package]
name = "tsnx-ffi"
description = "C ABI over tsnx-core, linked into the Switch app/sysmodule and host shims"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
crate-type = ["staticlib"]

# On Horizon the crate is no_std and gets its allocator and panic hook from the
# C side (src/platform.rs); elsewhere it links std.
[dependencies]
tsnx-core.workspace = true
log.workspace = true

# The app and sysmodule log at Info at most (tsnx_set_log_callback(.., 3)):
# leave out every debug and trace call, here and in the crates beneath, at
# compile time. Hosts keep them (TSNX_LOG_LEVEL).
[target.'cfg(target_os = "horizon")'.dependencies]
log = { workspace = true, features = ["max_level_info"] }

[features]
# Use the Switch's overlay buffer limits on hosts (memory tests).
switch-limits = ["tsnx-core/switch-limits"]
